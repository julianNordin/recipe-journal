# Two things live here: the database every workflow needs, and the container
# the application actually ships as.
#
# **`npm run db:up` starts `db` alone, on purpose.** `docker compose up -d`
# with no argument starts the application too, on port 3000, where the
# development server and the end-to-end suite both expect to find their own --
# and a stale container answering that port has cost this project three wrong
# conclusions already. Bringing the whole stack up is `docker compose up -d`,
# said deliberately.

services:
  db:
    image: postgres:18-alpine
    container_name: recipe-journal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_journal
      # Deterministic collation, so ORDER BY on a title sorts the same on a
      # developer machine and in CI.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/18/docker and declares
      # its VOLUME at /var/lib/postgresql. Mounting the pre-18 path that every
      # older example still shows puts the real cluster in the container's
      # writable layer while this named volume sits empty looking correct --
      # so every `compose down` silently starts from scratch.
      - db-data:/var/lib/postgresql
    healthcheck:
      # A TCP port opens well before the server accepts queries. pg_isready is
      # the difference between "container started" and "database usable", and
      # depends_on: service_healthy is only meaningful with it.
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe_journal"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # -------------------------------------------------------------------------
  # Migrations, as a one-shot service.
  #
  # **Built from the `builder` stage, which still has the Prisma CLI.** The
  # runtime image deliberately does not: the CLI and its schema engine are
  # around 200 MB, and shipping them so that every replica can race the same
  # `migrate deploy` at boot is the wrong trade twice over. One container runs
  # it once, `app` waits for it to exit cleanly, and the image that serves
  # traffic carries only what the server touches.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://recipe:recipe@db:5432/recipe_journal
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://recipe:recipe@db:5432/recipe_journal
      # Placeholders for a local run. A real deployment supplies its own, and
      # `src/env.ts` refuses to boot without them rather than failing later.
      NEXTAUTH_SECRET: local-development-secret-at-least-32-chars
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      # Not just "started". The app must not serve a request against a schema
      # that is still being applied.
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
